[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-brain-cli"
version = "0.1.0"
description = "A lightweight, local-first second brain for your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gracy Pawani" }]
dependencies = [
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
brain = "brain.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["brain"]
